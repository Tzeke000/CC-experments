# CI gates — suite health (zero skips) · lint (ruff) · type check (mypy) · tests.
#
# Making Things (MT-3): default runner is GitHub-hosted `ubuntu-latest` so jobs
# actually run on this fork (upstream hybridindie labels `[self-hosted, linux,
# hybridindie]` / `[self-hosted, godot]` have no runners here and stay queued).
#
# Optional self-hosted: set repo Actions variable MT_CI_RUNS_ON to a JSON array,
# e.g. ["self-hosted","making-things","godot"]. See docs/making-things/self-hosted-runner.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# uv uses its default cache on ubuntu-latest. Self-hosted hosts can export
# UV_CACHE_DIR=/runner/_work/_cache/uv in the runner's .env if they mount that path.
env:
  GODOT_MCP_ALLOW_INSECURE_BRIDGE: "1"

jobs:
  lint:
    name: lint (ruff)
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    # SECURITY: never execute untrusted fork code on a self-hosted runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Zero-skip scan (suite health)
        run: bash scripts/ci/check-no-skipped-tests.sh

      - name: Lint (ruff check)
        run: uv run ruff check .

  types:
    name: types (mypy)
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check (mypy)
        run: uv run mypy

  tests:
    name: tests (pytest)
    timeout-minutes: 25
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Tests (pytest)
        # Without GODOT_BIN, Godot-gated integration tests skipif (same as
        # upstream hybridindie linux pool). Live coverage is e2e.yml.
        run: uv run pytest -q

  camelcase:
    name: camelCase gate (compat bridge off)
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: camelCase regression gate (compat bridge off)
        env:
          FASTMCP_MCP_CAMELCASE_COMPAT: "false"
        run: uv run pytest -q tests/contract/test_tool_transform.py

  # Godot 4.4 floor — addon parse + headless smokes. Downloads 4.4 when no
  # baked binary (ubuntu-latest); uses /opt/godot/4.4/godot on a Making Things
  # self-hosted image when present.
  godot-floor:
    name: godot 4.4 floor (parse + smoke)
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Resolve Godot 4.4 (baked binary, else verified download)
        run: |
          set -euo pipefail
          baked=/opt/godot/4.4/godot
          if [ -x "$baked" ]; then
            echo "GODOT_BIN=$baked" >> "$GITHUB_ENV"
            "$baked" --version
            exit 0
          fi
          version=4.4-stable
          asset="Godot_v${version}_linux.x86_64.zip"
          dir="${RUNNER_TEMP:-/tmp}/godot44"
          mkdir -p "$dir"
          cd "$dir"
          if [ ! -x godot ]; then
            curl -fsSL -o "$asset" \
              "https://github.com/godotengine/godot/releases/download/${version}/${asset}"
            curl -fsSL -o SHA512-SUMS.txt \
              "https://github.com/godotengine/godot/releases/download/${version}/SHA512-SUMS.txt"
            awk -v f="$asset" '$2==f' SHA512-SUMS.txt | sha512sum -c -
            unzip -o -q "$asset"
            chmod +x "Godot_v${version}_linux.x86_64"
            ln -sf "Godot_v${version}_linux.x86_64" godot
          fi
          echo "GODOT_BIN=$dir/godot" >> "$GITHUB_ENV"
          "$dir/godot" --version

      - name: Verify the floor version
        run: |
          ver="$("$GODOT_BIN" --version)"
          echo "Godot: $ver"
          case "$ver" in
            4.4*) ;;
            *) echo "::error::expected Godot 4.4.x, got '$ver'"; exit 1 ;;
          esac

      - name: Parse the whole addon in the 4.4 editor
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP:-/tmp}/godot44-parse.log"
          timeout 180 "$GODOT_BIN" --headless --path godot --editor --quit \
            2>&1 | tee "$log"
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" "$log"; then
            echo "::error::the addon does not parse on the Godot 4.4 floor"
            exit 1
          fi

      - name: Headless smokes on the floor
        run: |
          uv run pytest -q \
            tests/integration/test_addon_read_smokes.py \
            tests/contract/test_addon_44_floor.py \
            tests/contract/test_probe_44_floor.py
