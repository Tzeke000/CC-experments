# Build and push a Godot-capable Actions runner image to GHCR (optional).
# Making Things: defaults to ubuntu-latest so this is not stuck on hybridindie
# labels. Image name follows this repository (not hybridindie/godot-mcp).
#
# Manual dispatch is the primary trigger. Owner may set MT_CI_RUNS_ON to a
# self-hosted label set after attaching a runner — see
# docs/making-things/self-hosted-runner.md.
name: runner-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/runner.Dockerfile"
      - ".github/workflows/runner-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ fromJSON(vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/godot-runner
          tags: |
            type=raw,value=4.7
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/runner.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}