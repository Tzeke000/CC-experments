# Live-editor end-to-end suites — coverage `ci` can't provide (Godot-gated tests
# skipif without GODOT_BIN).
#
# Making Things (MT-3): default runner is GitHub-hosted `ubuntu-latest` with a
# downloaded Godot 4.7.2 + xvfb so the suite runs without hybridindie k8s labels.
# Optional self-hosted: set repo var MT_E2E_RUNS_ON to
# ["self-hosted","making-things","godot"] — see docs/making-things/self-hosted-runner.md.
#
# TRIGGER POLICY: too heavy for every docs-only push — runs on workflow_dispatch,
# nightly on main, or PRs that touch addon/server/deps/this workflow.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  pull_request:
    paths:
      - "godot/addons/godot_mcp/**"
      - "godot/tests/**"
      - "godot/project.godot"
      - "mcp_server/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/e2e.yml"
      - "docs/making-things/self-hosted-runner.md"
      - "scripts/ci/**"

concurrency:
  group: e2e
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_MCP_ALLOW_INSECURE_BRIDGE: "1"

jobs:
  editor-suites:
    name: live editor (e2e + addon smoke)
    runs-on: ${{ fromJSON(vars.MT_E2E_RUNS_ON || vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (xvfb for play-session e2e)
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi
          command -v xvfb-run

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Resolve Godot 4.7 (baked, repo var, else download 4.7.2)
        run: |
          set -euo pipefail
          # Prefer explicit repo var, then common bake paths, else download.
          candidates=(
            "${{ vars.GODOT_BIN }}"
            /opt/godot/godot
            /opt/godot/4.7/godot
            "$HOME/godot/Godot_v4.7.2-stable_linux.x86_64"
          )
          for c in "${candidates[@]}"; do
            if [[ -n "$c" && -x "$c" ]]; then
              echo "GODOT_BIN=$c" >> "$GITHUB_ENV"
              "$c" --version
              exit 0
            fi
          done
          version=4.7.2-stable
          asset="Godot_v${version}_linux.x86_64.zip"
          dir="${RUNNER_TEMP:-/tmp}/godot47"
          mkdir -p "$dir"
          cd "$dir"
          curl -fsSL -o "$asset" \
            "https://github.com/godotengine/godot/releases/download/${version}/${asset}"
          unzip -o -q "$asset"
          chmod +x "Godot_v${version}_linux.x86_64"
          ln -sf "Godot_v${version}_linux.x86_64" godot
          echo "GODOT_BIN=$dir/godot" >> "$GITHUB_ENV"
          "$dir/godot" --version

      - name: Verify Godot version (pinned to 4.7)
        run: |
          ver="$("$GODOT_BIN" --version)"
          echo "Godot: $ver"
          case "$ver" in
            4.7*) ;;
            *) echo "::error::expected Godot 4.7.x on the runner, got '$ver'"; exit 1 ;;
          esac

      - name: Warm asset import
        run: 'timeout 180 "$GODOT_BIN" --headless --import --path godot/ || true'

      - name: Editor e2e + addon smoke suites
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            echo "::error::xvfb-run not found; play-session e2e would silently skip (#672)."
            exit 1
          fi
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout --signal=TERM --kill-after=10 1800 \
            uv run pytest -q -p no:cacheprovider \
            tests/integration \
            tests/contract/test_addon_guards.py \
            tests/contract/test_addon_handshake.py \
            tests/contract/test_router_refactor.py \
            tests/contract/test_undo_threshold.py

      - name: Reap stray Godot processes
        if: always()
        run: |
          pkill -f 'godot.*--editor' 2>/dev/null || true
          pkill -f 'godot.*remote-debug' 2>/dev/null || true
          sleep 1
          if pgrep -f 'godot.*(remote-debug|--editor)' >/dev/null; then
            echo "::warning::stray godot processes survived the reaping"
          fi

  godot-4-8-beta:
    name: live editor (Godot 4.8 beta, advisory)
    runs-on: ${{ fromJSON(vars.MT_E2E_RUNS_ON || vars.MT_CI_RUNS_ON || '["ubuntu-latest"]') }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install system deps (xvfb)
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
          fi

      - name: Install uv
        uses: ./.github/actions/setup-uv
        timeout-minutes: 5

      - name: Set up Python
        timeout-minutes: 5
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Resolve Godot 4.8 beta (baked, else verified download)
        run: |
          set -euo pipefail
          if [[ -n "${{ vars.GODOT48_BIN }}" && -x "${{ vars.GODOT48_BIN }}" ]]; then
            echo "GODOT_BIN=${{ vars.GODOT48_BIN }}" >> "$GITHUB_ENV"
            "${{ vars.GODOT48_BIN }}" --version
            exit 0
          fi
          if [ -x /opt/godot48/godot ]; then
            echo "GODOT_BIN=/opt/godot48/godot" >> "$GITHUB_ENV"
            /opt/godot48/godot --version
            exit 0
          fi
          version=4.8-beta1
          asset="Godot_v${version}_linux.x86_64.zip"
          sha512="aee4cbf3c5f86eee875c0f2f77cc9d816a3fbb220774e6ffc95fd5a557a6c5ec917f2b6118c0aa2008bd10f4b2a021225dc78ba7b7c54745411e0f2721f70a67"
          dir="${RUNNER_TEMP:-/tmp}/godot48"
          mkdir -p "$dir"
          cd "$dir"
          if [ ! -x godot ]; then
            # Prefer GitHub Releases (godot-builds) — downloads.godotengine.org
            # flaked with curl (92) HTTP/2 CANCEL on GH-hosted runners (~1m).
            # HTTP/1.1 + retries + mirror keep the advisory lane green without
            # baking a binary into the runner image.
            urls=(
              "https://github.com/godotengine/godot-builds/releases/download/${version}/${asset}"
              "https://downloads.godotengine.org/?version=4.8&flavor=beta1&slug=linux.x86_64.zip"
            )
            downloaded=0
            for url in "${urls[@]}"; do
              for attempt in 1 2 3; do
                echo "Downloading Godot ${version} from ${url} (attempt ${attempt})"
                rm -f "$asset"
                if curl -fsSL --http1.1 --retry 3 --retry-delay 2 --retry-all-errors \
                     -o "$asset" "$url"; then
                  if echo "${sha512}  ${asset}" | sha512sum -c -; then
                    downloaded=1
                    break 2
                  fi
                  echo "::warning::sha512 mismatch for ${url} attempt ${attempt}; retrying"
                else
                  echo "::warning::download failed for ${url} attempt ${attempt} (curl $?); retrying"
                fi
                sleep $((attempt * 2))
              done
            done
            if [ "$downloaded" != "1" ]; then
              echo "::error::could not download Godot ${version} from GitHub Releases or downloads.godotengine.org"
              exit 1
            fi
            unzip -o -q "$asset"
            chmod +x "Godot_v${version}_linux.x86_64"
            ln -sf "Godot_v${version}_linux.x86_64" godot
          fi
          echo "GODOT_BIN=$dir/godot" >> "$GITHUB_ENV"
          "$dir/godot" --version

      - name: Verify Godot 4.8 beta version
        run: |
          set -euo pipefail
          ver="$("$GODOT_BIN" --version)"
          echo "Godot: $ver"
          {
            echo "### Godot 4.8 beta verification lane"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Binary | \`$GODOT_BIN\` |"
            echo "| Version | \`$ver\` |"
            echo "| Gate | advisory — the 4.7 lane remains the stable gate |"
          } >> "$GITHUB_STEP_SUMMARY"
          if ! printf '%s' "$ver" | grep -Eq '^4[.-]8[.-]beta1([.-]|$)'; then
            echo "::error::expected Godot 4.8-beta1 on the beta lane, got '$ver'"
            exit 1
          fi

      - name: Warm asset import
        run: 'timeout 180 "$GODOT_BIN" --headless --import --path godot/ || true'

      - name: Editor e2e + addon smoke suites (4.8 beta)
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            timeout --signal=TERM --kill-after=10 1800 \
            uv run pytest -q -p no:cacheprovider \
            tests/integration \
            tests/contract/test_addon_guards.py \
            tests/contract/test_addon_handshake.py \
            tests/contract/test_router_refactor.py \
            tests/contract/test_undo_threshold.py

      - name: Reap stray Godot processes
        if: always()
        run: |
          pkill -f 'godot.*--editor' 2>/dev/null || true
          pkill -f 'godot.*remote-debug' 2>/dev/null || true
