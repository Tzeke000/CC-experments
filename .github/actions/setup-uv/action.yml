name: Setup uv (pinned, cached)
description: >
  Install the pinned uv binary. On Making Things / GitHub-hosted runners the
  binary lands under $RUNNER_TEMP. On hybridindie-style self-hosted pools that
  mount /runner/_work/_cache, the binary is reused from that shared cache
  (avoids the astral-sh/setup-uv download stall #750/#752).

inputs:
  version:
    description: uv version to install
    required: false
    default: "0.11.29"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: |
        set -euo pipefail
        version="${{ inputs.version }}"
        case "$(uname -m)" in
          x86_64) target="x86_64-unknown-linux-gnu" ;;
          aarch64|arm64) target="aarch64-unknown-linux-gnu" ;;
          *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
        esac
        asset="uv-${target}.tar.gz"
        # Prefer the self-hosted shared PVC when writable; else runner temp
        # (ubuntu-latest / Making Things cloud VM).
        if [[ -d /runner/_work/_cache ]] && [[ -w /runner/_work/_cache ]]; then
          bin_dir="/runner/_work/_cache/bin"
        else
          bin_dir="${RUNNER_TEMP:-/tmp}/making-things-uv-bin"
        fi
        bin="${bin_dir}/uv-${version}"
        mkdir -p "$bin_dir"
        if [ ! -x "$bin" ] || ! "$bin" --version | grep -q " ${version}"; then
          tmp="$(mktemp -d)"
          installed=0
          for base in \
            "https://github.com/astral-sh/uv/releases/download/${version}" \
            "https://releases.astral.sh/github/uv/releases/download/${version}"; do
            if timeout 90 curl -fsSL "$base/$asset" -o "$tmp/$asset" \
               && timeout 30 curl -fsSL "$base/$asset.sha256" -o "$tmp/$asset.sha256"; then
              if (cd "$tmp" && sha256sum -c "$asset.sha256"); then
                tar -xzf "$tmp/$asset" -C "$tmp"
                tmp_bin="${bin}.tmp.$$"
                install -m 0755 "$tmp/uv-${target}/uv" "$tmp_bin"
                mv -f "$tmp_bin" "$bin"
                installed=1
                break
              fi
            fi
          done
          rm -rf "$tmp"
          if [ "$installed" != "1" ]; then
            echo "::error::could not download uv ${version} from GitHub or the astral mirror"
            exit 1
          fi
        fi
        ln -sf "$bin" "$bin_dir/uv"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/uv" --version
